    case 'ahReg': formRegistro(v, null, id); break;
    case 'ahElegir': elegirCuenta(v); break;
    case 'ordenTC': S.ordenTC = v; try { localStorage.setItem(LS_BASE + '-ordenTC', v); } catch (er) {} render(); break;
    case 'agrupar': S.agrupar = v; try { localStorage.setItem(LS_BASE + '-agrupar', v); } catch (er) {} render(); break;
    case 'asignarTC': asignarTC(id); break;
    case 'asigF': { const f = S.cfg.fijos.find(x => x.id === id); f.metodo = f.metodo === v ? '' : v; saveCfg(); render(); asignarTC(v); toast(f.metodo ? `${f.n} → ${tarjeta(v).n}` : `${f.n} sin tarjeta`); break; }
    case 'tema': { const t = temaActual() === 'dark' ? 'light' : 'dark'; aplicarTema(t); S.cfg.tema = t; try { localStorage.setItem(LS_BASE + '-tema', t); } catch (e) {} saveCfg(); render(); toast(t === 'dark' ? 'Modo oscuro' : 'Modo claro'); break; }
    case 'info': showInfo(v); break;
    case 'montoFijo': editMontoFijo(id); break;
    case 'mfSolo': case 'mfTodos': guardarMontoFijo(a === 'mfTodos'); break;
    case 'ingExtra': openMov({ tipo: 'ingreso', metodo: 'debito', nota: '' }); break;
    case 'cats': verCats(); break;
    case 'formCat': formCat(id); break;
    case 'simT': S.sim ||= {}; S.sim[id] = !S.sim[id]; render(); break;
    case 'obStart': closeSheet(); startOB(); break;
    case 'obNext': obNext(); break;
    case 'obBack': obRead(); OB.step = Math.max(0, OB.step - 1); drawOB(); break;
    case 'obFrec': obRead(); OB.frec = v; if (v === 'quincenal' && !OB.dias.length) obSetDias([15, 30]); drawOB(); break;
    case 'obCalc': obRead(); OB.showCalc = !OB.showCalc; drawOB(); break;
    case 'obUsarNeto': obRead(); OB.sueldo = Math.round(netoDe(OB.bruto) * 100) / 100; OB.editado = false; OB.showCalc = false; obSplit(); drawOB(); break;
    case 'obDia': { obRead(); const d = +v; const ex = OB.dias.find(x => x.dia === d); if (ex) OB.dias = OB.dias.filter(x => x !== ex); else OB.dias.push({ dia: d, monto: 0 }); OB.dias.sort((x, y) => x.dia - y.dia); if (!OB.editado) obSplit(); drawOB(); break; }
    case 'obSugerir': obRead(); obSetDias(v.split(',').map(Number)); drawOB(); break;
    case 'obInc': obRead(); OB.incOn = !OB.incOn; drawOB(); break;
    case 'obFd': obRead(); OB.fdias[id] = +v; drawOB(); break;
    case 'obMeta': obRead(); OB.meta = +v; drawOB(); break;
    case 'tab': S.tab = v; S.anim = true; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'mes': S.mes = sumaMes(S.mes, +v); S.anim = true; render(); break;
    case 'nuevo': openMov(); break;
    case 'ajustes': ajustes(); break;
    case 'fMet': S.filtro.metodo = v; render(); break;
    case 'fCat': S.filtro.cat = v; render(); break;
    case 'editMov': openMov({}, id, el.dataset.m); break;
    case 'mTipo': SH.t.tipo = v; if (v === 'pago_tc' || v === 'ingreso') { if (tarjeta(SH.t.metodo)) SH.t.metodo = 'debito'; } drawMov(); break;
    case 'mMon': SH.t.monto = $('#mMonto').value; SH.t.mon = v; drawMov(); break;
    case 'mCat': { SH.t.cat = v; const cc = cat(v); if (!SH.metManual && !SH.editId && metValido(cc.metodo)) { SH.t.metodo = cc.metodo; const tc2 = tarjeta(cc.metodo); if (tc2) SH.t.mon = tc2.mon; } syncMovInputs(); drawMov(); break; }
    case 'mMet': SH.metManual = true; SH.t.metodo = v; const tc = tarjeta(v); if (tc && tc.mon !== SH.t.mon && SH.t.tipo === 'gasto') SH.t.mon = tc.mon; syncMovInputs(); drawMov(); break;
    case 'mDest': SH.t.destino = v; const d = tarjeta(v); if (d) { SH.t.mon = d.mon; if (!num($('#mMonto').value)) $('#mMonto').value = saldoTC(d) > 0 ? saldoTC(d) : ''; } syncMovInputs(); drawMov(); break;
    case 'mCuenta': SH.t.cuentaId = SH.t.cuentaId === v ? '' : v; syncMovInputs(); drawMov(); break;
    case 'mMeta': SH.t.metaId2 = SH.t.metaId2 === v ? '' : v; syncMovInputs(); drawMov(); break;
    case 'mGuardar': guardarMov(); break;
    case 'mBorrar':
      if (!v) { syncMovInputs(); SH.confirmDel = true; drawMov(); break; }
      { const mm = M(SH.editMes); mm.movs = mm.movs.filter(x => x.id !== SH.editId); saveMes(SH.editMes); closeSheet(); render(); toast('Movimiento borrado'); }
      break;
    case 'gBorrar':
      if (!SH.confirmDel) { SH.confirmDel = true; el.textContent = 'Toca otra vez para eliminar'; el.className = 'btn danger'; break; }
      SH.onDelete(); closeSheet(); render(); toast('Eliminado'); break;
    case 'pagarFijo': {
      const f = S.cfg.fijos.find(x => x.id === id); const mv = fijoMov(S.mes, id);
      if (mv) { M(S.mes).movs = M(S.mes).movs.filter(x => x.id !== mv.id); saveMes(S.mes); render(); toast(f.n + ' vuelve a pendiente'); }
      else openMov({ ...(metValido(f.metodo) ? { metodo: f.metodo } : {}), tipo: 'gasto', monto: fijoMonto(S.mes, f) || '', mon: f.mon, cat: f.cat, fijoId: f.id, nota: f.n, fecha: S.mes === mesActual() ? hoyISO() : S.mes + '-' + pad(Math.min(f.dia || 1, 28)) });
      break; }
    case 'editFijo': formFijo(id); break;
    case 'formFijo': formFijo(); break;
    case 'formTC': formTC(id); break;
    case 'verTC': verTC(id); break;
    case 'ajustarTC': ajustarTC(id); break;
    case 'pagarTC': { const c = tarjeta(id); closeSheet(); openMov({ tipo: 'pago_tc', destino: id, mon: c.mon, metodo: 'debito', monto: saldoTC(c) > 0 ? saldoTC(c) : '' }); break; }
    case 'gastoTC': { const c = tarjeta(id); closeSheet(); openMov({ tipo: 'gasto', metodo: id, mon: c.mon }); break; }
    case 'formPrest': formPrest(id); break;
    case 'verPrest': verPrest(id); break;
    case 'abonar': { const p = S.cfg.prestamos.find(x => x.id === id); closeSheet(); openMov({ tipo: 'gasto', prestamoId: id, cat: 'deudas', metodo: 'transferencia', nota: 'Abono ' + p.n }); break; }
    case 'formMeta': formMeta(id); break;
    case 'verMeta': verMeta(id); break;
    case 'aportar': { const g = S.cfg.metas.find(x => x.id === id); const r = resumen(S.mes); closeSheet(); openMov({ tipo: 'ahorro', metaId: id, metodo: 'debito', monto: (id === 'emergencia' ? r.reglaEmerg : r.reglaSal).toFixed(2), nota: '' }); break; }
    case 'formIng': formIng(); break;
    case 'editIng': formIng(id); break;
    case 'formNomina': formNomina(); break;
    case 'formInc': formInc(); break;
    case 'formTopes': formTopes(); break;
    case 'tk': { const mm = M(S.mes); mm.tickets = Math.max(0, (mm.tickets || 0) + +v); saveMes(S.mes); render(); break; }
    case 'usarInc': { upsertExtra({ id: 'inc-' + S.mes, tipo: 'incentivo', n: 'Incentivos de ' + MESES[+S.mes.slice(5) - 1], mes: S.mes, monto: num(v), bruto: num(id), seguro: true, ic: 'trend' }); saveCfg(); render(); toast('Incentivos de ' + MESES[+S.mes.slice(5) - 1] + ': ' + money(num(v)) + ' en tu proyección'); break; }
    case 'formExtra': formExtra(id, v); break;
    case 'exTipo': EXF.tipo = v; exRead(); drawExtra(); break;
    case 'exSeg': exRead(); EXF.seguro = v === '1'; drawExtra(); break;
    case 'exGuardar': guardarExtra(); break;
    case 'exBorrar': if (!EXF.confirm) { EXF.confirm = true; el.textContent = 'Toca otra vez para eliminar'; el.className = 'btn danger'; break; } S.cfg.extras = S.cfg.extras.filter(x => x.id !== EXF.id); saveCfg(); closeSheet(); render(); toast('Eliminado'); break;
    case 'recibir': { const x = S.cfg.extras.find(e => e.id === id); closeSheet(); openMov({ tipo: 'ingreso', monto: x.monto, metodo: 'debito', nota: x.n, extraId: x.id, fecha: x.mes === mesActual() ? hoyISO() : (x.mes < mesActual() ? x.mes + '-28' : hoyISO()) }); break; }
    case 'navidad': openNavidad(+v || +S.mes.slice(0, 4)); break;
    case 'nvApp': nvLlenar('app'); break;
    case 'nvFill': { nvRead(); const sd = Math.round(num(NV.sueldo) * 100) / 100; if (!(sd > 0)) { toast('Escribe tu sueldo actual'); break; } const mA = +mesActual().slice(5) - 1, esteAnio = NV.y === +mesActual().slice(0, 4); let n = 0; NV.meses = NV.meses.map((x, k) => { const ok = v === 'todos' || (v === 'vacios' && !(num(x) > 0)) || (v === 'resto' && esteAnio && k >= mA); if (ok) n++; return ok ? sd : x; }); drawNavidad(); nvAutoSave(); toast(n ? `Rellené ${n} mes${n > 1 ? 'es' : ''} con ${money(sd)}` : 'No había meses vacíos'); break; }
    case 'nvSueldo': nvLlenar('sueldo'); break;
    case 'nvBon': nvRead(); NV.bon = !NV.bon; drawNavidad(); nvAutoSave(); break;
    case 'nvVac': nvRead(); NV.vac = !NV.vac; if (NV.vac && !navDatos(NV.y)?.mesVac && NV.ingreso) NV.mesVac = NV.y + '-' + NV.ingreso.slice(5, 7); drawNavidad(); nvAutoSave(); break;
    case 'nvVacSeg': nvRead(); NV.vacSeg = v === '1'; drawNavidad(); nvAutoSave(); break;
    case 'excel': exportarExcel(); break;
    case 'calendario': abrirCalendario(); break;
    case 'icsGo': generarICS(); break;
    case 'agendaTodo': agendaHoja(); break;
    case 'restaurarTexto': hojaRestaurarTexto(); break;
    case 'restaurarTextoSi': { try { restaurarDatos(JSON.parse(($('#rtxt').value || '').trim())); } catch (er) { toast('Ese texto no es un respaldo de esta app'); } break; }
    case 'auModo': auLeer(); Object.assign(AUTH, { modo: v, paso: 1, err: '', ok: '', olvide: false }); drawAuth(); break;
    case 'auCodigo': auLeer(); Object.assign(AUTH, { modo: 'codigo', paso: 1, err: '', ok: '', olvide: false }); drawAuth(); break;
    case 'auOlvide': auLeer(); Object.assign(AUTH, { modo: 'codigo', paso: 1, err: '', ok: '', olvide: true }); drawAuth(); break;
    case 'auVer': ['au_pass', 'au_pass2'].forEach(k => { const i = document.getElementById(k); if (i) i.type = i.type === 'password' ? 'text' : 'password'; }); break;
    case 'auReenviar': auReenviar(); break;
    case 'auReset': auReset(); break;
    case 'salir': confirmarSalir(); break;
    case 'salirSi': cerrarSesion(); break;
    case 'cambiarPass': cambiarPass(); break;
    case 'subirSi': { const vj = SH?.viejo; if (!vj) break; S.cfg = migrate(vj.d.cfg); S.months = vj.d.months || {}; S.stamps = {}; persist(['config', ...Object.keys(S.months).map(docKey)]); try { localStorage.removeItem(vj.k); } catch (er) {} closeSheet(); S.anim = true; render(); toast('Listo: tus datos ya están en tu cuenta'); if (!S.cfg.onboarded) startOB(); break; }
    case 'subirNo': closeSheet(); if (!S.cfg.onboarded) startOB(); break;
    case 'nvGuardar': guardarNavidad(); break;
    case 'usarPromInc': S.cfg.incPromedio = num(v); saveCfg(); render(); toast('Promedio de incentivos: ' + money(num(v)) + ' como posible cada mes'); break;
    case 'exportar': {
      const data = JSON.stringify({ app: 'ahorro-inteligente', v: 1, fecha: new Date().toISOString(), cfg: S.cfg, months: S.months }, null, 2);
      const r = await descargar('ahorro-inteligente-respaldo-' + hoyISO() + '.json', data, 'application/json');
      if (r === 'ok') toast('Respaldo listo'); else if (r === 'fail') toast('No se pudo descargar aquí. Usa "Copiar datos".');
      break; }
    case 'copiar': {
      const data = JSON.stringify({ app: 'ahorro-inteligente', v: 1, cfg: S.cfg, months: S.months });
      try { await navigator.clipboard.writeText(data); toast('Datos copiados'); } catch (err) { toast('Tu navegador no dejó copiar'); }
      break; }
    case 'limpiar': openSheet(`${sheetH('¿Empezar desde cero?')}<div class="stack">
        <div class="alert bad"><span class="dot"></span><div>Se borran <b>todos</b> tus datos de este dispositivo${DB ? ' y de tu cuenta' : ''}: movimientos, gastos fijos, tarjetas, préstamos, metas, ingresos extra y Salario de Navidad. No se puede deshacer.</div></div>
        <p class="small muted" style="margin:0">Te recomiendo descargar un respaldo antes, para poder recuperar todo con "Restaurar".</p>
        <button class="btn ghost" data-act="exportar">Descargar respaldo primero</button>
        <button class="btn danger" data-act="limpiarSi">Sí, borrar todo</button>
        <button class="btn ghost" data-act="close">Cancelar</button></div>`, { limpiarConfirm: false }); break;
    case 'limpiarSi':
      if (!SH.limpiarConfirm) { SH.limpiarConfirm = true; el.textContent = 'Toca otra vez para confirmar'; break; }
      S.cfg = plantillaLimpia(); S.months = {}; S.sim = {}; saveCfg();
      if (DB) { try { const snap = await DB.collection('data/users/' + UIDV).get(); for (const d of snap.docs) if (d.id !== 'config') await DB.doc('data/users/' + UIDV + '/' + d.id).delete(); } catch (err) {} }
      S.mes = mesActual(); S.tab = 'inicio'; closeSheet(); render(); startOB(); toast('Listo: la app quedó limpia'); break;
    case 'reset':
      if (!SH.resetConfirm) { SH.resetConfirm = true; el.textContent = 'Toca otra vez: se borra todo'; break; }
      S.cfg = plantilla(); S.months = {}; saveCfg(); if (DB) { try { const snap = await DB.collection('data/users/' + UIDV).get(); for (const d of snap.docs) if (d.id !== 'config') await DB.doc('data/users/' + UIDV + '/' + d.id).delete(); } catch (err) {} }
      closeSheet(); render(); startOB(); break;
  }
});
function syncMovInputs() { if (!SH?.t) return; const m = $('#mMonto'), f = $('#mFecha'), n = $('#mNota'); if (m) SH.t.monto = m.value; if (f) SH.t.fecha = f.value; if (n) SH.t.nota = n.value; }
document.addEventListener('input', e => {
  if (e.target.id?.startsWith('ex_')) { exLive(); return; }
  if (e.target.id?.startsWith('nv_')) { nvRead(); nvLive(); nvAutoSave(); return; }
  if (e.target.id === 'ob_meta') { OB.meta = +e.target.value; obLive(); return; }
  if (e.target.dataset?.ob || e.target.dataset?.obm) { obRead(); obLive(); return; }
  const a = e.target.dataset?.act;
  if (a === 'buscar') { S.filtro.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) {} }
  if (a === 'mMonto' && SH?.t) SH.t.monto = e.target.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'auForm') { auEnviar(); return; }
  if (e.target.id === 'passForm') { guardarPass(); return; }
  if (e.target.id === 'gForm') { const err = SH.onSave(leerForm()); if (typeof err === 'string') { toast(err); return; } closeSheet(); render(); toast('Guardado'); }
  if (e.target.id === 'aForm') {
    S.cfg.nombre = $('#aNombre').value.trim() || S.cfg.nombre; S.cfg.tasa = num($('#aTasa').value) || 65;
    S.cfg.ahorro.emerg = num($('#aEm').value); S.cfg.ahorro.sal = num($('#aSal').value);
    saveCfg(); closeSheet(); render(); toast('Ajustes guardados');
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile') {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { try { restaurarDatos(JSON.parse(rd.result)); } catch (er) { toast('Ese archivo no es un respaldo de esta app'); } };
    rd.readAsText(file);
  }
  if (e.target.name === 'color') { document.querySelectorAll('#gForm input[name=color]').forEach(r => r.nextElementSibling.style.outline = r.checked ? '3px solid var(--ink)' : 'none'); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.classList?.contains('grp')) { S.cerrados ||= {}; S.cerrados[d.dataset.g] = !d.open; } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.infoOpen) { setInfo(false); document.querySelector('[data-act=creador]')?.focus(); } if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); if (e.key === 'Enter' && OB && !$('#ob').hidden && e.target.tagName === 'INPUT') { e.preventDefault(); obNext(); } });

/* ============ Arranque ============ */
(function boot() {
  try { aplicarTema(localStorage.getItem(LS_BASE + '-tema')); S.agrupar = localStorage.getItem(LS_BASE + '-agrupar') || 'reglon'; S.ordenTC = localStorage.getItem(LS_BASE + '-ordenTC') || 'pago'; } catch (e) {}
  if (nubeConfigurada()) { iniciarNube(); return; }
  const local = lsLoad();
  if (local && local.cfg) { S.cfg = migrate(local.cfg); S.months = local.months || {}; S.stamps = local.stamps || {}; migrarMeses(); } else S.cfg = plantilla();
  S.anim = true;
  render();
  const local0 = !!(local && local.cfg && local.cfg.onboarded);
  Promise.race([conectar(), new Promise(r => setTimeout(r, 3000))]).then(() => { if (!S.cfg.onboarded && !local0) startOB(); });
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e)));
</script>
