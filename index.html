/* ============ Proyección ============ */
const NECESIDADES = ['vivienda', 'alimentacion', 'bebe', 'salud', 'vehiculo', 'educacion'];
const DEUDAS = ['deudas'];
const metaPct = () => num(S.cfg.ahorro.emerg) + num(S.cfg.ahorro.sal);
const cobros = () => S.cfg.ingresos.filter(i => i.dia > 0).sort((a, b) => a.dia - b.dia);
function periodoDe(dia) { const c = cobros(); if (!c.length) return -1; let k = c.length - 1; c.forEach((x, j) => { if (x.dia <= dia) k = j; }); return k; }
function flujo(m) {
  const c = cobros(); const per = c.map(i => ({ i, ingreso: ingresoDe(m, i), fijos: [], totalF: 0 }));
  if (!per.length) return per;
  const sinDia = [];
  for (const f of S.cfg.fijos) { const v = fijoRD(m, f); if (v <= 0) continue; const dc = diaCaja(f); if (dc > 0) { const p = per[periodoDe(dc)]; p.fijos.push({ f, v, dc }); p.totalF += v; } else sinDia.push({ f, v }); }
  const ingT = sum(per, p => p.ingreso) || 1, totSin = sum(sinDia, x => x.v);
  const meta = sum(S.cfg.ingresos, i => ingresoDe(m, i)) * metaPct() / 100;
  per.forEach(p => { const sh = p.ingreso / ingT; p.repartido = totSin * sh; p.totalF += p.repartido; p.ahorro = meta * sh; p.libre = p.ingreso - p.totalF - p.ahorro; });
  return per;
}
function variablesEstimadas(m) {
  const prev = [1, 2, 3].map(k => sumaMes(m, -k)).filter(x => (S.months[x]?.movs || []).some(t => t.tipo === 'gasto' && !t.fijoId));
  if (prev.length) return { v: sum(prev, x => resumen(x).variables) / prev.length, f: 'promedio de tus últimos ' + (prev.length > 1 ? prev.length + ' meses' : 'mes') };
  const r = resumen(m);
  if (m === mesActual() && r.variables > 0) { const h = new Date(); return { v: r.variables / h.getDate() * diasMes(h.getFullYear(), h.getMonth()), f: 'tu ritmo de gasto de este mes' }; }
  const topes = sum(S.cfg.categorias, c => c.tope || 0);
  if (topes) return { v: topes, f: 'la suma de tus topes' };
  return { v: r.variables, f: 'lo registrado; anota tus gastos para afinarlo' };
}
function porBucket(m) {
  const fx = id => sum(S.cfg.fijos.filter(f => f.cat === id), f => fijoRD(m, f)) + variablePorCat(m, id);
  const all = S.cfg.categorias.map(c => c.id);
  const nec = sum(NECESIDADES, fx), deu = sum(DEUDAS, fx);
  const des = sum(all.filter(id => !NECESIDADES.includes(id) && !DEUDAS.includes(id)), fx);
  return { nec, des, deu, fx };
}
function diagnostico(m) {
  const r = resumen(m), ing = r.ingPlan || 1, out = [];
  const pct = v => Math.round(v / ing * 100);
  const meta = r.ingPlan * metaPct() / 100, ve = variablesEstimadas(m).v;
  const libreProy = r.ingPlan + r.ingSeguro - r.fijosPlan - ve;
  const b = porBucket(m);
  const fijos = S.cfg.fijos.map(f => ({ f, v: fijoRD(m, f) })).filter(x => x.v > 0).sort((a, c) => c.v - a.v);
  if (r.fijosPlan / ing > .7) out.push({ k: 'bad', t: `Tus gastos fijos se comen el ${pct(r.fijosPlan)}% de tu sueldo`, d: `Lo sano es que no pasen del 50–60%. Te quedan ${money(r.ingPlan - r.fijosPlan)} para todo lo demás.`, s: 'Mira tus fijos más grandes abajo y decide cuáles puedes bajar, pausar o renegociar.' });
  else if (r.fijosPlan / ing > .55) out.push({ k: 'warn', t: `Tus gastos fijos son el ${pct(r.fijosPlan)}% de tu sueldo`, d: `Estás por encima del 55%. Cualquier gasto inesperado te deja sin margen.`, s: 'Intenta bajar al menos uno de los fijos grandes.' });
  if (libreProy < meta) out.push({ k: 'bad', t: 'Así como vas no llegas a tu meta de ahorro', d: `Tu meta es ${money(meta)} al mes (${metaPct()}%). Después de fijos${ve ? ' y gastos variables estimados' : ''} te quedan ${money(libreProy)}.`, s: `Te faltan ${money(meta - libreProy)} al mes. Prueba el simulador de recortes de abajo.` });
  for (const p of flujo(m)) if (p.libre < 0) out.push({ k: 'bad', ic: 'calendar', t: `El cobro del día ${p.i.dia} no alcanza`, d: `Recibes ${money(p.ingreso)}, pero en ese tramo salen ${money(p.totalF)} de fijos y ${money(p.ahorro)} de ahorro.`, s: 'Mueve algún pago al otro cobro, o deja guardado dinero del cobro anterior para cubrirlo.' });
  if (b.deu / ing > .36) out.push({ k: 'bad', ic: 'bank', t: `Las cuotas de deudas son el ${pct(b.deu)}% de tu sueldo`, d: 'Los bancos consideran riesgoso pasar del 36%. Cada peso en intereses es un peso que no ahorras.', s: 'Abona extra a la deuda con interés más alto y evita sacar préstamos nuevos.' });
  else if (b.deu / ing > .2) out.push({ k: 'warn', ic: 'bank', t: `Las cuotas de deudas son el ${pct(b.deu)}% de tu sueldo`, d: `Pagas ${money(b.deu)} al mes en cuotas. Está manejable, pero ojo con sumarle más.`, s: 'Cuando termines una deuda, pasa esa misma cuota a tu ahorro.' });
  const viv = b.fx('vivienda'); if (viv / ing > .3) out.push({ k: 'warn', ic: 'vivienda', t: `Vivienda es el ${pct(viv)}% de tu sueldo`, d: 'Lo recomendado es no pasar del 30%.', s: 'Revisa el plan de internet/celular y el consumo de luz.' });
  if (b.des / ing > .3) out.push({ k: 'warn', ic: 'entretenimiento', t: `Los gustos son el ${pct(b.des)}% de tu sueldo`, d: 'Salidas, suscripciones, cuidado personal y compras pasan del 30%.', s: 'Es lo más fácil de recortar sin afectar lo esencial.' });
  for (const x of fijos.slice(0, 3)) if (x.v / ing > .15) out.push({ k: 'warn', ic: icF(x.f), t: `${esc(x.f.n)} se lleva el ${pct(x.v)}% de tu sueldo`, d: `Es de tus gastos fijos más pesados: ${money(x.v)} al mes.`, s: x.f.cat === 'educacion' ? 'Es una inversión. Pregunta por descuento por pronto pago o un plan sin intereses.' : x.f.cat === 'deudas' ? 'Si puedes abonar a capital, la cuota o el plazo bajan.' : 'Compara precios o negocia el monto.' });
  for (const f of S.cfg.fijos) { const mv = fijoMov(m, f.id); const plan = fijoRD(m, f); if (mv && plan > 0 && toRD(mv.monto, mv.mon) > plan * 1.05) out.push({ k: 'warn', ic: icF(f), t: `${esc(f.n)} costó más de lo planeado`, d: `Planeaste ${money(plan)} y pagaste ${money(toRD(mv.monto, mv.mon))}.`, s: 'Si el aumento es permanente, actualiza el monto "de ahora en adelante".' }); }
  for (const c of S.cfg.categorias) if (c.tope > 0) { const g = variablePorCat(m, c.id); if (g > c.tope) out.push({ k: 'bad', ic: icC(c), t: `Te pasaste del tope de ${esc(c.n)}`, d: `Llevas ${money(g)} de ${money(c.tope)}.`, s: 'Frena esta categoría hasta el próximo mes.' }); }
  for (const c of S.cfg.tarjetas) { const sd = saldoTC(c); if (c.limite > 0 && sd / c.limite > .3) out.push({ k: sd / c.limite > .7 ? 'bad' : 'warn', ic: 'pago_tc', t: `${esc(c.n)} está al ${Math.round(sd / c.limite * 100)}% del límite`, d: 'Usar más del 30% del límite baja tu puntaje de crédito.', s: 'Paga el total al corte para no generar intereses.' }); }
  const usd = fijos.filter(x => x.f.mon === 'US'); if (usd.length) out.push({ k: 'info', ic: 'coin', t: `Tienes ${usd.length} pagos en dólares (${money(sum(usd, x => x.v))} al mes)`, d: `Si el dólar sube RD$1, esos pagos te cuestan ${money(sum(usd, x => fijoMonto(m, x.f)))} más al mes.`, s: 'Revisa si usas todas esas suscripciones.' });
  if (!out.some(x => x.k === 'bad' || x.k === 'warn')) out.unshift({ k: 'good', ic: 'check', t: 'Vas bien', d: 'Tus gastos están dentro de lo recomendado y llegas a tu meta de ahorro.', s: 'Si te sobra, sube tu meta un par de puntos.' });
  const ord = { bad: 0, warn: 1, info: 2, good: 3 };
  return out.sort((a, c) => ord[a.k] - ord[c.k]);
}
const dgIcon = { bad: 'alert', warn: 'alert', info: 'bulb', good: 'check' };
const dgHTML = x => `<div class="dg k-${x.k}"><span class="di">${svgI(x.ic || dgIcon[x.k], 18, 2)}</span><b>${x.t}</b><div class="dd">${x.d}</div>${x.s ? `<div class="ds"><em>Qué hacer:</em> ${x.s}</div>` : ''}</div>`;

function presupuestoDiario() {
  const hoy = new Date(), d = hoy.getDate(), y = hoy.getFullYear(), mo = hoy.getMonth(), mes = mesActual(), c = cobros();

function lineChart(series, labels) {

  const ih = H - pb - pt, iw = W - pl - pr, x = i => pl + iw * i / (labels.length - 1), y = v => pt + ih - v / nice * ih;
  let g = '';

  labels.forEach((l, i) => { if (i % 2 === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle">${l}</text>`; });
  for (const s of series) {

const DIAS_MES_LAB = 23.83;
function diffYMD(a, b) {

}

}

function icsTexto(op) {

  if (op.cobro) for (const i of cobros()) ev('cobro-' + i.id, i.dia, '💵 Cobro: ' + i.n, `Te entran ${money(i.m)}. Separa primero tu ahorro (${metaPct()}%).`, [0]);

      delete: async () => { const { error } = await sb.from('docs').delete().eq('user_id', uid).eq('key', clave(p)); if (error) throw error; },
    }),

      get: async () => { const { data, error } = await sb.from('docs').select('key,data,t').eq('user_id', uid); if (error) throw error; return { docs: (data || []).map(r => ({ id: r.key, data: () => ({ data: r.data, t: Number(r.t) || 0 }) })) }; },

function errEs(e) {

  if (m.includes('email not confirmed')) return 'Todavía no has confirmado tu correo.';
  if (m.includes('already registered') || m.includes('already been registered') || code === 'user_already_exists') return 'Ese correo ya tiene una cuenta. Entra con tu contraseña.';
  if (m.includes('signups not allowed') || m.includes('user not found') || code === 'otp_disabled') return 'No hay una cuenta con ese correo. Créala primero.';
  if (code === 'same_password' || m.includes('different from the old')) return 'Usa una contraseña distinta a la anterior.';
  if (m.includes('expired') || m.includes('token') || m.includes('otp')) return 'El código está mal o ya venció. Pide uno nuevo.';
  if (m.includes('rate limit') || m.includes('security purposes') || e?.status === 429) return 'Espera un momento antes de pedir otro correo.';
  if (m.includes('password') && (m.includes('should') || m.includes('weak'))) return 'La contraseña es muy débil. Usa al menos 8 caracteres con letras y números.';

/* Números escritos como sea: 1,200,000 · 1.2 millones · 500k · 350 mil · RD$ 45,000.50 */
function hnMonto(t) {
  const s = String(t || '').toLowerCase().replace(/rd\$|us\$|\$/g, ' ');
  const m = s.match(/(\d[\d.,]*)\s*(millones|millon|millón|mm|m\b|mil|k\b)?/);
  if (!m) return null;
  let n = m[1];
  if (n.includes(',') && n.includes('.')) n = n.lastIndexOf('.') > n.lastIndexOf(',') ? n.replace(/,/g, '') : n.replace(/\./g, '').replace(',', '.');
  else if (n.includes(',')) n = /^\d{1,3}(,\d{3})+$/.test(n) ? n.replace(/,/g, '') : n.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3}){2,}$/.test(n) || /^\d{1,3}\.\d{3}$/.test(n) && !m[2]) n = n.replace(/\./g, '');

function hnCoachPos() {

function hnBuscarTema(s) {
  let best = null, bs = 0;
  for (const t of [...H_KB.temas, ...hnFin()]) {
    let sc = 0;
    for (const c of t.claves || []) { const k = hnNorm(c); if (k && (' ' + s + ' ').includes(' ' + k + ' ')) sc += 2 + k.split(' ').length; else if (k && s.includes(k)) sc += 1 + k.split(' ').length * 0.5; }
    const tt = hnNorm(t.titulo); if (tt && s.includes(tt)) sc += 4;
    if (sc > bs) { bs = sc; best = t; }
  }
  if (best && bs >= 2) return best;
  // Respaldo: palabras sueltas en común
  const pal = s.split(' ').filter(w => w.length > 3 && !['como','donde','cuando','quiero','puedo','tengo','para','esta','este','esto','hago','hacer','sobre','tiene','porque'].includes(w));
  if (!pal.length) return null;
  bs = 0; best = null;
  const raiz = w => w.slice(0, Math.max(4, w.length - 2));
  for (const t of [...H_KB.temas, ...hnFin()]) {
    const bag = ' ' + hnNorm((t.claves || []).join(' ')) + ' ', tit = ' ' + hnNorm(t.titulo) + ' ', bw = bag.trim().split(' ');
    const sc = pal.filter(w => bag.includes(' ' + raiz(w)) || bw.some(x => hnParecido(w, x))).length + pal.filter(w => tit.includes(' ' + raiz(w))).length * 0.6;
    if (sc > bs) { bs = sc; best = t; }
  }
  return bs >= Math.min(2, pal.length) ? best : null;
}

// Fecha que alguien promete (siempre hacia adelante): "el 30", "el 5 de diciembre", "mañana", "el viernes"
function hnFechaFutura(s) {
  const h = new Date(); h.setHours(12, 0, 0, 0);
  if (/pasado manana/.test(s)) { h.setDate(h.getDate() + 2); return iso(h); }
  if (/manana/.test(s)) { h.setDate(h.getDate() + 1); return iso(h); }
  const dsem = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'].findIndex(d => new RegExp('\\b' + d + '\\b').test(s));
  if (dsem >= 0) { let k = (dsem - h.getDay() + 7) % 7 || 7; h.setDate(h.getDate() + k); return iso(h); }
  if (/quincena/.test(s)) { const d = h.getDate() < 15 ? 15 : diasMes(h.getFullYear(), h.getMonth()) <= 30 ? diasMes(h.getFullYear(), h.getMonth()) : 30; return iso(new Date(h.getFullYear(), h.getMonth(), d)); }
  let m = s.match(/\b(\d{1,2}) de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/);
  if (m) { const mo = HN_MESES_N.indexOf(m[2]); let y = h.getFullYear(); if (mo < h.getMonth() || (mo === h.getMonth() && +m[1] < h.getDate())) y++; return iso(new Date(y, mo, Math.min(+m[1], diasMes(y, mo)))); }
  m = s.match(/\b(?:el|dia) (\d{1,2})\b/);
  if (m && +m[1] >= 1 && +m[1] <= 31) { let y = h.getFullYear(), mo = h.getMonth(); if (+m[1] < h.getDate()) { mo++; if (mo > 11) { mo = 0; y++; } } return iso(new Date(y, mo, Math.min(+m[1], diasMes(y, mo)))); }
  return '';
}

  const m = mesActual(), r = resumen(m), obj = r.reglaTotal, ah = r.ahorrado;
  const h = new Date(), dm = diasMes(h.getFullYear(), h.getMonth()), dias = dm - h.getDate();
  if (!(r.ingPlan > 0) || !(obj > 0)) return null;
  if (ah >= obj) return { k: 'bien', txt: hnAnimo('bien', { ahorrado: money(ah), meta: money(obj) }), tono: 'good' };
  if (ah >= obj * 0.75) return { k: 'casi', txt: hnAnimo('casi', { falta: money(obj - ah) }), tono: 'good' };
  if (h.getDate() >= 18) return { k: 'atrasado', txt: hnAnimo('atrasado', { falta: money(obj - ah), dias }), tono: 'warn' };
  return null;
}
// Días seguidos sin pasarse del presupuesto diario (aproximado con lo que se puede gastar hoy)
function hnRacha() {
  const p = presupuestoDiario(); if (!(p.diario > 0)) return 0;
  let n = 0; const d = new Date();
  for (let k = 1; k <= 30; k++) { d.setDate(d.getDate() - 1); const f = iso(d); const g = sum(allMovs().filter(t => t.tipo === 'gasto' && !t.fijoId && !t.prestamoId && t.fecha === f), t => toRD(t.monto, t.mon)); if (g > p.diario * 1.05) break; n++; }
  return allMovs().length ? n : 0;
}

// Después de guardar un movimiento: celebrar o frenar con cariño
function hnTrasMov(t) {
  if (!t || !t.monto) return;
  setTimeout(() => {
    if (t.prestamoId) { const p = S.cfg.prestamos.find(x => x.id === t.prestamoId); if (p) hnBurbuja(esc(hnAnimo('deudaBaja', { deuda: p.n })), { tono: 'good' }); return; }
    if (t.tipo === 'ahorro' && t.metaId) {
      const g = S.cfg.metas.find(x => x.id === t.metaId); if (!g || !(g.obj > 0)) return hnBurbuja(esc(hnAnimo('bien', { ahorrado: money(resumen(mesActual()).ahorrado), meta: '' })), { tono: 'good' });
      const ap = aportadoMeta(g), antes = ap - toRD(t.monto, t.mon), pct = ap / g.obj * 100, pAntes = antes / g.obj * 100;
      if (ap >= g.obj && antes < g.obj) return hnBurbuja(esc(hnAnimo('metaLograda', { meta: g.n })), { tono: 'good', ms: 12000 });
      const hito = [75, 50, 25].find(x => pct >= x && pAntes < x);
      if (hito) return hnBurbuja(esc(hnAnimo('metaHito', { meta: g.n, pct: hito })), { tono: 'good' });
      return hnBurbuja(esc(hnAnimo('bien', { ahorrado: money(resumen(mesActual()).ahorrado), meta: g.n })), { tono: 'good' });
    }
    if (t.tipo !== 'gasto' || t.fijoId || mesDe(t.fecha) !== mesActual()) return;
    const c = cat(t.cat);
    if (c && num(c.tope) > 0) {
      const g = variablePorCat(mesActual(), c.id), antes = g - toRD(t.monto, t.mon);
      if (g > c.tope && antes <= c.tope) return hnBurbuja(esc(hnAnimo('frenar', { categoria: c.n, exceso: money(g - c.tope) })), { tono: 'warn', ms: 12000 });
      if (g >= c.tope * 0.8 && antes < c.tope * 0.8) return hnBurbuja(esc(hnAnimo('tope', { categoria: c.n, pct: Math.round(g / c.tope * 100) })), { tono: 'warn' });
    }
    const p = presupuestoDiario(), antes = p.usado - toRD(t.monto, t.mon);
    if (p.usado > p.total && antes <= p.total && hnLS('hn-frenar') !== hoyISO()) { hnLS('hn-frenar', hoyISO()); return hnBurbuja(esc(hnAnimo('frenar', { categoria: c ? c.n : 'gastos', exceso: money(p.usado - p.total) })), { tono: 'warn', ms: 12000 }); }
  }, 450);
}

/* ============ Perfil: sexo y fecha de nacimiento (se piden una sola vez y no se editan) ============ */
// Los textos de Hannah usan marcas {masculino|femenino}, por ejemplo "Bienvenid{o|a}" o "{campeón|campeona}".
// gx() las resuelve justo al mostrar, según el perfil del usuario.
const PF_RE = /\{([^{}|]*)\|([^{}|]*)\}/g;
function sexoU() {
  const p = S.cfg && S.cfg.perfil;
  if (p && (p.sexo === 'h' || p.sexo === 'm')) return p.sexo;
  try { const u = ultimoUsuario(); return u && (u.sexo === 'h' || u.sexo === 'm') ? u.sexo : ''; } catch (e) { return ''; }
}
const esMujer = () => sexoU() === 'm';
function gx(s) {
  if (s == null) return s; s = String(s);
  if (s.indexOf('|') < 0) return s;
  const m = esMujer();
  return s.replace(PF_RE, (_, a, b) => m ? b : a);
}
const G = (h, m) => esMujer() ? m : h;

const PF_MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function pfPartes(v) { return String(v || '').split('-').map(Number); }
function nacValida(v) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v || '')) return false;
  const [y, m, d] = pfPartes(v), f = new Date(y, m - 1, d);
  if (f.getFullYear() !== y || f.getMonth() !== m - 1 || f.getDate() !== d) return false;
  return v >= '1900-01-01' && v <= hoyISO();
}
const perfilOk = () => !!(S.cfg && S.cfg.perfil && (S.cfg.perfil.sexo === 'h' || S.cfg.perfil.sexo === 'm') && nacValida(S.cfg.perfil.nac));
const nacTexto = v => { const [y, m, d] = pfPartes(v); return `${d} de ${PF_MESES[m - 1]} de ${y}`; };
const esBisiesto = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
function cumpleHoy(d = new Date()) {
  if (!perfilOk()) return false;
  const [, m, dd] = pfPartes(S.cfg.perfil.nac), M = d.getMonth() + 1, D = d.getDate();
  if (m === 2 && dd === 29 && !esBisiesto(d.getFullYear())) return M === 2 && D === 28;
  return M === m && D === dd;
}
function edadU(d = new Date()) {
  if (!perfilOk()) return 0;
  const [y, m, dd] = pfPartes(S.cfg.perfil.nac);
  let e = d.getFullYear() - y;
  if (!cumpleHoy(d) && (d.getMonth() + 1 < m || (d.getMonth() + 1 === m && d.getDate() < dd))) e--;
  return e;
}
function diasParaCumple(d = new Date()) {
  if (!perfilOk()) return null;
  if (cumpleHoy(d)) return 0;
  const [, m, dd] = pfPartes(S.cfg.perfil.nac), hoy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  for (const y of [d.getFullYear(), d.getFullYear() + 1]) {
    const dia = m === 2 && dd === 29 && !esBisiesto(y) ? 28 : dd, f = new Date(y, m - 1, dia);

  }
  return null;
}

  if (!el) { el = document.createElement('div'); el.id = 'pf'; el.className = 'pf'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'pfTit'); document.body.appendChild(el); }
  PF.abierto = true; el.hidden = false; document.body.classList.add('pf-on'); document.body.style.overflow = 'hidden';
  if (typeof hnBurbujaFuera === 'function') hnBurbujaFuera();
  if (typeof hnCerrar === 'function' && HN && HN.open) hnCerrar();
  pfDibujar();
}
function pfDibujar() {
  const el = $('#pf'); if (!el) return;
  const nuevo = !(S.cfg && S.cfg.onboarded), sx = PF.sexo, m = sx === 'm';
  const err = PF.err ? `<div class="auth-err" role="alert">${esc(PF.err)}</div>` : '';
  let body;
  if (PF.paso === 1) {
    body = `<h2 id="pfTit">${nuevo ? 'Antes de empezar, cuéntame de ti' : '¡Hola de nuevo! Me falta conocerte un poquito'}</h2>
      <p class="pf-sub">Así te hablo como se debe y, el día de tu cumpleaños, te tengo una sorpresa 🎂${nuevo ? '' : ' Tus datos siguen intactos.'}</p>
      <div class="f"><span>¿Cómo te identificas?</span>
        <div class="pf-sx" role="radiogroup" aria-label="Sexo">
          <button type="button" role="radio" aria-checked="${sx === 'h'}" class="${sx === 'h' ? 'on' : ''}" data-pf="sexo" data-v="h"><span aria-hidden="true">👨</span>Hombre</button>
          <button type="button" role="radio" aria-checked="${sx === 'm'}" class="${sx === 'm' ? 'on' : ''}" data-pf="sexo" data-v="m"><span aria-hidden="true">👩</span>Mujer</button>
        </div></div>
      <label class="f">Fecha de nacimiento<input class="in" type="date" id="pfNac" min="1900-01-01" max="${hoyISO()}" value="${esc(PF.nac)}"></label>
      <div class="pf-nota">${svgI('lock', 15, 2)}<span>Esto se guarda <b>una sola vez</b> y después no se puede cambiar. Revísalo bien.</span></div>
      ${err}
      <button class="btn" type="button" data-pf="seguir">Continuar</button>`;
  } else {
    const e = (() => { const [y, mm, d] = pfPartes(PF.nac), h = new Date(); let a = h.getFullYear() - y; if (h.getMonth() + 1 < mm || (h.getMonth() + 1 === mm && h.getDate() < d)) a--; return a; })();
    body = `<h2 id="pfTit">¿Está todo bien?</h2>
      <p class="pf-sub">Revísalo con calma: después no se puede cambiar.</p>
      <div class="pf-res"><div><span class="muted small">Sexo</span><b>${m ? '👩 Mujer' : '👨 Hombre'}</b></div>
        <div><span class="muted small">${m ? 'Nacida' : 'Nacido'} el</span><b>${esc(nacTexto(PF.nac))}</b><span class="muted small">${e} años</span></div></div>
      ${err}
      <button class="btn" type="button" data-pf="guardar">Sí, está bien</button>
      <button class="btn ghost" type="button" data-pf="corregir">Corregir</button>`;
  }
  el.innerHTML = `<div class="pf-in"><div class="pf-card">
    <img class="pf-han" src="${HANNAH_IMG.saluda || HANNAH_IMG.avatar}" alt="Hannah">
    ${body}</div></div>`;
}
function pfLeer() { const n = document.getElementById('pfNac'); if (n) PF.nac = n.value; }
function pfAccion(a, b) {
  if (a === 'sexo') { pfLeer(); PF.sexo = b.dataset.v; PF.err = ''; document.querySelectorAll('#pf [data-pf=sexo]').forEach(x => { const on = x.dataset.v === PF.sexo; x.classList.toggle('on', on); x.setAttribute('aria-checked', String(on)); }); const er = $('#pf .auth-err'); if (er) er.remove(); return; }
  if (a === 'seguir') {
    pfLeer();
    if (!PF.sexo) { PF.err = 'Elige si eres hombre o mujer.'; return pfDibujar(); }
    if (!PF.nac) { PF.err = 'Escribe tu fecha de nacimiento.'; return pfDibujar(); }
    if (!nacValida(PF.nac)) { PF.err = 'Esa fecha no es válida. Revisa el día, el mes y el año.'; return pfDibujar(); }
    PF.err = ''; PF.paso = 2; return pfDibujar();
  }
  if (a === 'corregir') { PF.paso = 1; PF.err = ''; return pfDibujar(); }
  if (a === 'guardar') {
    if (!perfilOk()) { S.cfg.perfil = { sexo: PF.sexo, nac: PF.nac, t: Date.now() }; saveCfg(); }
    try { if (typeof SB !== 'undefined' && SB && USR) SB.auth.updateUser({ data: { sexo: S.cfg.perfil.sexo, nac: S.cfg.perfil.nac } }).catch(() => {}); } catch (e) {}
    pfRecordar(); perfilCerrar();
    render(); toast('¡Gracias! Ya te conozco mejor 💚');
    const nx = PF.next; PF.next = null; if (nx) setTimeout(nx, 250);
  }
}
function perfilCerrar() {
  const el = $('#pf'); if (el) { el.hidden = true; el.innerHTML = ''; }
  Object.assign(PF, { abierto: false, sexo: '', nac: '', paso: 1, err: '' });
  document.body.classList.remove('pf-on'); document.body.style.overflow = '';
  if (typeof hnBtnVis === 'function') hnBtnVis();
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('#pf [data-pf]'); if (b) { e.preventDefault(); pfAccion(b.dataset.pf, b); } });
document.addEventListener('keydown', e => { if (PF.abierto && e.key === 'Enter' && e.target.id === 'pfNac') { e.preventDefault(); pfAccion(PF.paso === 1 ? 'seguir' : 'guardar'); } });

/* ---------- Hannah responde "¿cuándo es mi cumpleaños?" ---------- */
const hnDatosSinPerfil = hnDatos;
hnDatos = function (s, raw) {
  if (/\b(mi )?(cumple|cumpleanos|cumpleaños)\b/.test(s) && /\b(mi|cuando|cuanto|falta|faltan|dias)\b/.test(s) && !/\bde (mi|un|una|la|el) (mama|papa|madre|padre|hijo|hija|esposa|esposo|novia|novio|amigo|amiga|hermano|hermana)\b/.test(s) && perfilOk()) {
    const dc = diasParaCumple(), f = S.cfg.perfil.nac, [, m, d] = pfPartes(f);
    if (dc === 0) return hnSay([esc(cumpleTexto())], [chip('Consejo del día', 'consejoHoy', 'sparkle'), chip('Menú', 'menu')]), true;
    return hnSay([`Tu cumpleaños es el <b>${d} de ${PF_MESES[m - 1]}</b>. Faltan <b>${dc} día${dc === 1 ? '' : 's'}</b> 🎂`, dc <= 45 ? 'Si quieres celebrarlo sin descuadrarte, crea una meta para ese día y aparta un poquito desde ahora 😉' : 'Ese día te tengo una sorpresa. 😉'], [...(dc <= 45 ? [chip('Crear una meta', 'meta', 'meta', true)] : []), chip('Menú', 'menu')]), true;
  }
  return hnDatosSinPerfil(s, raw);
};

/* ============ Feriados RD · avisos de Hannah el día antes y el mismo día ============
 *
 * Fuentes (consultadas el 11-nov-2026):
 *  - 2026: calendario del Ministerio de Trabajo, reportado por Diario Libre
 *    https://diariolibre.com/actualidad/nacional/2025/11/05/los-fines-de-semana-largos-del-2026-en-republica-dominicana/3302123
 *    y Revista Mercado https://revistamercado.do/money-invest/daily-news/dias-feriados/
 *  - 2027: calendario oficial del Ministerio de Trabajo (comunicado del 1-nov-2026), reportado por
 *    elDinero https://eldinero.com.do/?p=386891 y Revista Mercado
 *    https://revistamercado.do/money-invest/daily-news/feriados-2027-calendario-oficial-ministerio-de-trabajo/
 *  - 2028: aún NO publicado. Fechas calculadas con la Ley 139-97 → marcadas `estimado: true`.
 *
 * Regla de la Ley 139-97 (solo para Reyes, Duarte, Día del Trabajo y Constitución):
 *   martes o miércoles → lunes anterior; jueves o viernes → lunes siguiente; sáb/dom/lun → no se mueve.
 * No se mueven: 1 ene, 21 ene, 27 feb, Viernes Santo, Corpus Christi, 16 ago, 24 sep, 25 dic.
 *
 * Verificado (fecha que se disfruta):
 *   2026: 1 ene, 5 ene (Reyes, del 6), 21 ene, 26 ene, 27 feb, 3 abr, 4 may (Trabajo, del 1), 4 jun,
 *         16 ago (domingo, no se mueve), 24 sep, 9 nov (Constitución, del 6), 25 dic.
 *   2027: 1 ene, 4 ene (Reyes, del 6), 21 ene, 25 ene (Duarte, del 26), 27 feb, 26 mar, 1 may, 27 may,
 *         16 ago, 24 sep, 6 nov, 25 dic.
 * Calculado (2028, estimado): 1 ene, 10 ene (Reyes, del jue 6), 21 ene, 24 ene (Duarte, del mié 26),
 *         27 feb, 14 abr, 1 may, 15 jun, 16 ago, 24 sep, 6 nov, 25 dic.
 * Viernes Santo = Pascua − 2; Corpus Christi = Pascua + 60 (Pascua por el algoritmo gregoriano).
 *
 * Días especiales (NO son feriados, `tipo: 'especial'`): Día de las Madres (último domingo de mayo),
 * Día de los Padres (último domingo de julio), Nochebuena (24 dic) y Despedida de año (31 dic).
 */
const FERIADOS_RD = (() => {
  const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  const pad = n => String(n).padStart(2, '0');
  const mk = (y, m, d) => new Date(y, m - 1, d, 12);
  const iso = dt => `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
  const add = (dt, n) => mk(dt.getFullYear(), dt.getMonth() + 1, dt.getDate() + n);
  const larga = dt => `${DIAS[dt.getDay()]} ${dt.getDate()} de ${MESES[dt.getMonth()]}`;

  // Pascua (algoritmo anónimo gregoriano / Meeus)
  const pascua = y => {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
    return mk(y, mes, dia);
  };
  // Ley 139-97: mar/mié → lunes anterior; jue/vie → lunes siguiente
  const ley139 = dt => {
    const w = dt.getDay();
    if (w === 2 || w === 3) return add(dt, 1 - w);

/* Lista de feriados y días especiales entre dos fechas ISO (inclusive), ordenada */
function feriadosRD(desde, hasta) {
  const a = desde || '0000-01-01', b = hasta || '9999-12-31';
  return FERIADOS_RD.filter(f => f.fecha >= a && f.fecha <= b);
}

/* Aviso de Hannah: primero lo de hoy, si no, lo de mañana; null si no hay nada */
function avisoFeriado(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  const isoL = x => `${x.getFullYear()}-${p(x.getMonth() + 1)}-${p(x.getDate())}`;
  const hoy = isoL(d);
  const man = isoL(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 12));
  const elegir = fecha => {
    const xs = FERIADOS_RD.filter(f => f.fecha === fecha);
    return xs.find(f => f.tipo === 'feriado') || xs[0] || null;
  };
  const h = elegir(hoy);
  if (h) return { cuando: 'hoy', item: h, texto: h.msgHoy };
  const m = elegir(man);
  if (m) return { cuando: 'manana', item: m, texto: m.msgManana };
  return null;
}

/* ===== Modo Navidad (automático en diciembre) =====

const NAV_ = (() => {
  // Gorro de Santa en coordenadas 120×96. Centro del ala: (56, 67).
  const P = {
    cono: 'M16 70C19 42 33 16 58 11C82 6 101 21 105 47C98 37 91 33 85 35C89 46 92 58 95 70Z',
    pliegue: 'M58 11C82 6 101 21 105 47C98 37 91 33 85 35C79 24 70 16 58 11Z',
    brillo: 'M28 60C31 44 40 27 55 19',
    ala: 'M10 67C10 61 14 57 21 57H91C98 57 103 61 103 67C103 73 98 77 91 77H21C14 77 10 73 10 67Z',
  };
  // Posición del gorro en cada pose (px de la imagen original): x, y = centro del ala; w = ancho; r = giro (grados); pad = espacio extra arriba
  const POSES = {
    explica: { x: 112, y: 36, w: 128, r: -9, pad: 46 },
    piensa: { x: 140, y: 61, w: 108, r: -8 },
    celebra: { x: 138, y: 100, w: 102, r: -7 },
    anota: { x: 134, y: 61, w: 108, r: -6 },
    ahorra: { x: 178, y: 57, w: 100, r: -6 },

  const sel = {

    envolver: 'img.hn-av, img.hn-mini:not(.sp), .hn-tip-dia > img, img.about-av, .meta-plan > img, .hn-burb > img, .hn-animo > img',
  };

  function hatOn(ctx, x, y, w, rotDeg) {
    const k = w / 112;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rotDeg * Math.PI / 180); ctx.scale(k, k); ctx.translate(-56, -67);
    ctx.shadowColor = 'rgba(60,0,10,.35)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    let g = ctx.createLinearGradient(16, 10, 100, 72);
    g.addColorStop(0, '#F0465B'); g.addColorStop(.5, '#C8102E'); g.addColorStop(1, '#860A1F');
    ctx.fillStyle = g; ctx.fill(new Path2D(P.cono));

    ctx.fillStyle = 'rgba(96,7,22,.35)'; ctx.fill(new Path2D(P.pliegue));

    ctx.shadowColor = 'rgba(60,0,10,.3)'; ctx.shadowBlur = 4; ctx.shadowOffsetY = 1.5;
    ctx.fillStyle = blanco(56, 64, 48); ctx.fill(new Path2D(P.ala));
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(17 + i * 10, i % 2 ? 58.5 : 75.5, 4.2, 0, 7); ctx.fill(); }
    ctx.fillStyle = blanco(104, 50, 11); ctx.beginPath(); ctx.arc(104, 50, 11, 0, 7); ctx.fill();

  function cargar(src) {

  }

  async function poseConGorro(k) {
    const p = POSES[k]; const src = HANNAH_IMG[k];
    const im = await cargar(src);
    const pad = p.pad || 0;
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight + pad;
    const x = c.getContext('2d'); x.drawImage(im, 0, pad); hatOn(x, p.x, p.y + pad, p.w, p.r);
    return c.toDataURL(pad ? 'image/png' : 'image/webp', .9);
  }

  async function logoNavidad(src, size) {
    const im = await cargar(src);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, size, size);
    // Verde → rojo navideño (solo píxeles verdosos; blanco y dorado quedan igual)
    const d = x.getImageData(0, 0, size, size), a = d.data;
    for (let i = 0; i < a.length; i += 4) {
      const r = a[i], g = a[i + 1], b = a[i + 2];
      const t = Math.max(0, Math.min(1, (g - Math.max(r, b * .95)) / 30));
      if (t <= 0) continue;
      const R = Math.min(255, g * 1.75 + 6), G = r * .45, B = b * .5 + 8;
      a[i] = r + (R - r) * t; a[i + 1] = g + (G - g) * t; a[i + 2] = b + (B - b) * t;
    }
    x.putImageData(d, 0, 0);
    const s = size / 180;
    // Copitos de nieve
    x.fillStyle = 'rgba(255,255,255,.75)';
    [[24, 30, 2.4], [150, 24, 2], [30, 140, 1.8], [158, 128, 2.2], [42, 84, 1.4], [140, 160, 1.5], [18, 100, 1.2], [118, 18, 1.3]]
      .forEach(([cx, cy, r]) => { x.beginPath(); x.arc(cx * s, cy * s, Math.max(.8, r * s), 0, 7); x.fill(); });
    // Gorro sobre la cabeza del cerdito

  function generar() {
    if (st.gen) return st.gen;
    const touch = document.querySelector('link[rel=apple-touch-icon]')?.getAttribute('href') || '';
    st.touch = touch;

    if (touch) {
      tareas.push(logoNavidad(touch, 180).then(u => { st.logo = u; }).catch(() => {}));
      tareas.push(logoNavidad(touch, 64).then(u => { st.fav = u; }).catch(() => {}));
    }
    if (typeof HANNAH_IMG === 'object' && HANNAH_IMG) Object.keys(POSES).forEach(k => {
      if (HANNAH_IMG[k]) tareas.push(poseConGorro(k).then(u => { st.poses[k] = u; }).catch(() => {}));

  function claveHannah(src) {
    if (!src || typeof HANNAH_IMG !== 'object' || !HANNAH_IMG || src.length < 200) return '';

  function decorarImg(img) {
    if (img.dataset.navK || img.dataset.navLogo) return;
    const src = img.getAttribute('src');
    if (!src || src.length < 200) return;

      if (st.logo) { img.dataset.navLogo = '1'; img.setAttribute('src', st.logo); }

    }
    const k = claveHannah(src);
    if (k && st.poses[k]) { img.dataset.navK = k; img.setAttribute('src', st.poses[k]); }
  }

  function envolver(img) {
    const p = img.parentElement;
    if (!p || p.tagName === 'NAV-HW') return;
    const w = document.createElement('nav-hw');
    if (img.classList.contains('hn-mini')) w.className = 'mini';

  function decorar(root) {
    if (!root || !root.querySelectorAll) return;
    if (root.matches && root.matches('img')) { decorarImg(root); if (root.matches(sel.envolver)) envolver(root); return; }

    document.querySelectorAll('nav-hw').forEach(w => {
      const img = w.querySelector('img'); if (img) w.parentElement.insertBefore(img, w); w.remove();

    const fav = document.querySelector('link[rel=icon]'); if (fav && st.favOrig) fav.setAttribute('href', st.favOrig);
    const tc = document.querySelector('meta[name=theme-color]'); if (tc && st.themeOrig) tc.setAttribute('content', st.themeOrig);
  }

  function iconos() {
    const fav = document.querySelector('link[rel=icon]');
    if (fav && st.fav) { if (!st.favOrig) st.favOrig = fav.getAttribute('href'); fav.setAttribute('href', st.fav); }
    const tc = document.querySelector('meta[name=theme-color]');
    if (tc) { if (!st.themeOrig) st.themeOrig = tc.getAttribute('content'); tc.setAttribute('content', '#7A0E1F'); }
  }

  function encender() {
    document.documentElement.classList.add('navidad');
    decorar(document.body);
    iconos();
    if (!st.obs && typeof MutationObserver === 'function') {
      st.obs = new MutationObserver(ms => {
        for (const m of ms) {
          if (m.type === 'attributes') { const t = m.target; if (t.tagName === 'IMG' && !t.dataset.navK && !t.dataset.navLogo) decorar(t); continue; }
          m.addedNodes.forEach(n => { if (n.nodeType === 1 && n.tagName !== 'NAV-HAT' && n.tagName !== 'NAV-HW') decorar(n); });

    }

  }

  function apagar() {
    if (st.obs) { st.obs.disconnect(); st.obs = null; }
    restaurar();
    document.documentElement.classList.remove('navidad');
  }

  function forzado() {
    try { const v = localStorage.getItem('ahorro-navidad'); return v === 'on' ? true : v === 'off' ? false : null; } catch (e) { return null; }
  }

  function programar() {
    clearTimeout(st.timer);
    const a = new Date(), m = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 1, 0, 0, 2);
    st.timer = setTimeout(() => { aplicarNavidad(); programar(); }, Math.min(m - a, 2147483000));
  }

  return { forzado, encender, apagar, programar, st };
})();

function navidadActiva(d = new Date()) {
  const f = NAV_.forzado();
  if (f !== null) return f;
  return d.getMonth() === 11;
}

function aplicarNavidad() {
  if (!document.body) return false;
  const on = navidadActiva();
  if (on === NAV_.st.on && document.documentElement.classList.contains('navidad') === on) return on;
  NAV_.st.on = on;
  if (on) NAV_.encender(); else NAV_.apagar();
  return on;
}

function navidadSaludo(d = new Date()) {
  if (!navidadActiva(d)) return '';
  const dia = d.getDate();
  if (d.getMonth() === 11 && dia === 24) return '🎄 ¡Feliz Nochebuena! Disfruta la cena en familia; el presupuesto ya hizo su parte.';
  if (d.getMonth() === 11 && dia === 25) return '🎅 ¡Feliz Navidad! Hoy toca compartir; mañana seguimos ahorrando juntos.';
  if (d.getMonth() === 11 && dia >= 26) return '🎆 ¡Feliz fin de año! Cerremos diciembre sin deudas nuevas y con la meta de enero clara.';
  const frases = [
    '🎄 ¡Feliz Navidad! Si te llegó la regalía pascual, aparta una parte para tu ahorro antes de gastar.',
    '🎄 ¡Feliz Navidad! Ponle un tope a los regalos y yo te ayudo a cuidarlo.',
    '🎄 ¡Feliz Navidad! Diciembre se disfruta más cuando enero no asusta.',
  ];
  return frases[dia % frases.length];
}

(() => {
  const go = () => { aplicarNavidad(); NAV_.programar(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  document.addEventListener('visibilitychange', () => {
    const r = document.documentElement;
    if (document.hidden) { if (NAV_.st.on) r.classList.add('nav-pausa'); return; }
    r.classList.remove('nav-pausa'); aplicarNavidad(); NAV_.programar();
  });
})();


/* ============ Préstamos con interés diario, bancos / personas y cuentas por cobrar (v1.4.0) ============ */
const BANCOS_RE = /banco|popular|bhd|banreservas|reservas|scotia|santa cruz|\bbsc\b|apap|cibao|promerica|lafise|vimenca|caribe|ademi|banesco|\bbdi\b|qik|asociaci|cooperativa|coop\b|financiera|motor cr|leasing|banfondesa|adopem|lopez de haro|bellbank|alaver|la nacional|confisa|banco multiple/i;

// Pagos que cuentan para un préstamo: sus abonos y, si está conectado a un gasto fijo, las cuotas pagadas desde que se conectó
function pagosPrest(p) {
  const hist = [...(p.fijoHist || []), ...(p.fijoId ? [{ fijoId: p.fijoId, desde: p.vinculoTs || '', hasta: '9' }] : [])];
  return allMovs().filter(t => t.prestamoId === p.id || (t.fijoId && hist.some(h => h.fijoId === t.fijoId && (t.ts || '') > (h.desde || '9') && (t.ts || '') <= h.hasta)))
    .sort((a, b) => (a.fecha + (a.ts || '')).localeCompare(b.fecha + (b.ts || '')));

// Cálculo del saldo: el interés corre cada día sobre el capital; cada pago cubre primero el interés acumulado y lo demás baja el capital
function prestInfo(p, hasta = hoyISO()) {

function pagarParte(f) {
  const m = S.mes, pg = fijoPagos(m, f.id), N = partesDelMes(m, f);
  if (fijoCompleto(m, f) && pg.length) { const last = pg[pg.length - 1]; M(m).movs = M(m).movs.filter(x => x.id !== last.id); saveMes(m); render(); toast(`Quité el último pago de ${f.n}`); return; }
  const falta = Math.max(0, fijoMonto(m, f) - sum(pg, t => conv(t.monto, t.mon, f.mon)));
  const monto = Math.min(num(f.parte), falta) || num(f.parte);
  openMov({ ...(metValido(f.metodo) ? { metodo: f.metodo } : {}), tipo: 'gasto', monto, mon: f.mon, cat: f.cat, fijoId: f.id, nota: `${f.n} (${pg.length + 1} de ${N})`, fecha: m === mesActual() ? hoyISO() : m + '-' + pad(Math.min(f.dia || 1, 28)) });
}
// Agenda: los próximos pagos semanales
function agendaPartes(dentro, add) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  for (const f of S.cfg.fijos) {
    if (!esPartes(f) || f.freq !== 'semana' || tarjeta(f.metodo)) continue;
    for (let k = 0; k <= 31; k++) {
      const d = new Date(hoy); d.setDate(d.getDate() + k); if (!dentro(d) || d.getDay() !== num(f.diaSem)) continue;
      const m = mesDe(iso(d)); if (fijoCompleto(m, f)) continue;
      add({ fecha: d, k: 'fijo', t: f.n, s: 'Pago semanal' + (metValido(f.metodo) ? ' · con ' + metodo(f.metodo).n : ''), monto: toRD(num(f.parte), f.mon), c: cat(f.cat).c, ic: icF(f), act: 'editFijo', id: f.id });
    }
  }
}

/* ---------- Formulario: ¿cómo lo pagas? ---------- */
function formFijo(id) {
  formFijoV1(id);

    <div class="eyebrow" style="margin-bottom:7px">¿Cómo lo pagas?</div>
    <div class="seg seg-sm pt-seg">${[['mes', 'Una vez al mes'], ['semana', 'Cada semana'], ['quincena', 'Cada quincena'], ['veces', 'Varias veces'], ['meses', 'Cada varios meses']].map(([k, n]) => `<button type="button" class="${freq === k ? 'on' : ''}" data-ptf="${k}">${n}</button>`).join('')}</div>
    <input type="hidden" name="freq" id="g_freq" value="${freq}">

      <label class="f pt-cada">¿Cada cuántos meses?<select class="in" name="cada" id="g_cada">${[[2, 'Cada 2 meses (bimestral)'], [3, 'Cada 3 meses (trimestral)'], [4, 'Cada 4 meses (cuatrimestral)'], [6, 'Cada 6 meses (semestral)'], [12, 'Una vez al año']].map(([v, n]) => `<option value="${v}" ${String(f?.cada ?? 4) === String(v) ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="f pt-cada">¿En qué mes te toca el próximo pago?<input class="in" type="month" name="mesIni" id="g_mesIni" value="${esc(f?.mesIni || mesActual())}"></label>
      <label class="f pt-cada">¿Te ayudan con una parte? (beca, subsidio) · opcional<input class="in" name="ayuda" id="g_ayuda" inputmode="decimal" placeholder="Ej. 40000" value="${f && f.ayuda ? esc(f.ayuda) : ''}"></label>
      <label class="row pt-cada pt-chk"><input type="checkbox" name="apartar" id="g_apartar" ${!f || f.apartar !== false ? 'checked' : ''}><span>Apartar un poco cada mes para tener el dinero listo</span></label>
      <label class="f pt-veces">¿Cuántas veces al mes?<input class="in" name="veces" id="g_veces" inputmode="numeric" placeholder="Ej. 3" value="${f && f.veces != null ? esc(f.veces) : ''}"></label>
    </div>
    <div class="pt-prev" id="ptPrev"></div></div>`;
  if (mLbl) mLbl.insertAdjacentHTML('beforebegin', html); else form.insertAdjacentHTML('afterbegin', html);
  SH.fields.push({ k: 'freq' }, { k: 'parte', type: 'num' }, { k: 'diaSem' }, { k: 'veces', type: 'num' }, { k: 'cada', type: 'num' }, { k: 'mesIni' }, { k: 'ayuda', type: 'num' }, { k: 'apartar', type: 'check' });
  const orig = SH.onSave;
  SH.onSave = o => {
    if (o.freq === 'mes' || !o.freq) { o.freq = 'mes'; delete o.parte; delete o.veces; return orig(o); }
    if (!(o.parte > 0)) return 'Pon el monto de cada pago';
    if (o.freq === 'meses') {
      if (!/^\d{4}-\d{2}$/.test(o.mesIni || '')) return 'Elige el mes del próximo pago';
      o.cada = Math.max(2, Math.min(12, Math.round(o.cada || 4))); o.m = o.parte; o.ayuda = Math.max(0, o.ayuda || 0);
      const err = orig(o); if (typeof err === 'string') return err;
      const fx = S.cfg.fijos.find(x => x.n === o.n && x.freq === 'meses' && x.mesIni === o.mesIni) || f; if (fx) { perGuardarMeta(fx); saveCfg(); }
      return err;
    }
    o.diaSem = +o.diaSem || 0; if (o.freq === 'veces') o.veces = Math.max(1, Math.min(31, Math.round(o.veces || 1)));
    o.m = Math.round(o.parte * partesDelMes(mesActual(), o) * 100) / 100; // monto de referencia del mes actual
    return orig(o);
  };
  const pinta = () => {
    const fr = $('#g_freq').value, partes = fr !== 'mes';
    $('#ptForm').classList.toggle('partes', partes); $('#ptForm').dataset.f = fr;
    if (mLbl) mLbl.hidden = partes;
    const p = num($('#g_parte').value), tmp = { freq: fr, parte: p, diaSem: +$('#g_diaSem').value, veces: num($('#g_veces').value), cada: num($('#g_cada').value), mesIni: $('#g_mesIni').value, ayuda: num($('#g_ayuda').value), apartar: $('#g_apartar').checked };
    if (fr === 'meses') { $('#ptPrev').innerHTML = !(p > 0) ? '<span class="muted">Escribe cuánto pagas cada vez.</span>' : perPreview(tmp); return; }
    const meses = [mesActual(), mesDe(iso(new Date(new Date().getFullYear(), new Date().getMonth() + 1, 1)))];
    $('#ptPrev').innerHTML = !partes ? '' : !(p > 0) ? '<span class="muted">Escribe cuánto pagas cada vez y te calculo el total del mes.</span>'
      : meses.map(m => { const N = partesDelMes(m, tmp); return `<div><b>${MESES[+m.slice(5) - 1]}:</b> ${N} ${fr === 'semana' ? DIAS_SEM_PL[tmp.diaSem] : fr === 'quincena' ? 'quincenas' : 'pagos'} × ${money(p)} = <b>${money(p * N)}</b></div>`; }).join('') + `<div class="tiny muted" style="margin-top:4px">Cada vez que pagues, toca el cuadrito y se anota un pago. Cuando completes todos, queda en verde.</div>`;
  };
  $('#ptForm').addEventListener('click', e => { const b = e.target.closest('[data-ptf]'); if (!b) return; $('#g_freq').value = b.dataset.ptf; $('#ptForm').querySelectorAll('[data-ptf]').forEach(x => x.classList.toggle('on', x === b)); pinta(); });
  ['g_parte', 'g_diaSem', 'g_veces', 'g_cada', 'g_mesIni', 'g_ayuda', 'g_apartar'].forEach(k => { $('#' + k).addEventListener('input', pinta); $('#' + k).addEventListener('change', pinta); });
  pinta();
}

function perPreview(t) {
  if (!/^\d{4}-\d{2}$/.test(t.mesIni || '')) return '<span class="muted">Elige el mes del próximo pago.</span>';
  const c = Math.round(t.cada || 4), meses = []; for (let k = 0; k < 12; k += c) meses.push(sumarMeses(t.mesIni, k));
  const neto = Math.max(0, t.parte - (t.ayuda || 0)), mens = Math.ceil(neto / c * 100) / 100;
  return `<div><b>Te toca en:</b> ${meses.map(mesNombre).join(', ')}.</div>
    <div>Pagas <b>${money(t.parte)}</b>${t.ayuda > 0 ? ` − te ayudan ${money(t.ayuda)} = <b>${money(neto)}</b> de tu bolsillo` : ''}.</div>
    ${t.apartar ? `<div>Apartando <b>${money(mens)} al mes</b>, cuando llegue el pago ya tienes el dinero listo. Creo una meta para que lo veas crecer.</div>` : ''}
    <div class="tiny muted" style="margin-top:4px">Solo cuenta como gasto en los meses que te toca. ${t.ayuda > 0 ? 'La ayuda anótala en Plan → Extras cuando te llegue.' : ''}</div>`;
}

    case 'copiar': {
      const data = JSON.stringify({ app: 'ahorro-inteligente', v: 1, cfg: S.cfg, months: S.months });
      try { await navigator.clipboard.writeText(data); toast('Datos copiados'); } catch (err) { toast('Tu navegador no dejó copiar'); }
      break; }
    case 'limpiar': openSheet(`${sheetH('¿Empezar desde cero?')}<div class="stack">
        <div class="alert bad"><span class="dot"></span><div>Se borran <b>todos</b> tus datos de este dispositivo${DB ? ' y de tu cuenta' : ''}: movimientos, gastos fijos, tarjetas, préstamos, metas, ingresos extra y Salario de Navidad. No se puede deshacer.</div></div>
        <p class="small muted" style="margin:0">Te recomiendo descargar un respaldo antes, para poder recuperar todo con "Restaurar".</p>
        <button class="btn ghost" data-act="exportar">Descargar respaldo primero</button>
        <button class="btn danger" data-act="limpiarSi">Sí, borrar todo</button>
        <button class="btn ghost" data-act="close">Cancelar</button></div>`, { limpiarConfirm: false }); break;
    case 'limpiarSi':
      if (!SH.limpiarConfirm) { SH.limpiarConfirm = true; el.textContent = 'Toca otra vez para confirmar'; break; }
      { const pf0 = S.cfg.perfil; S.cfg = plantillaLimpia(); if (pf0) S.cfg.perfil = pf0; } S.months = {}; S.sim = {}; saveCfg();
      if (DB) { try { const snap = await DB.collection('data/users/' + UIDV).get(); for (const d of snap.docs) if (d.id !== 'config') await DB.doc('data/users/' + UIDV + '/' + d.id).delete(); } catch (err) {} }
      S.mes = mesActual(); S.tab = 'inicio'; closeSheet(); render(); startOB(); toast('Listo: la app quedó limpia'); break;
    case 'reset':
      if (!SH.resetConfirm) { SH.resetConfirm = true; el.textContent = 'Toca otra vez: se borra todo'; break; }
      { const pf0 = S.cfg.perfil; S.cfg = plantilla(); if (pf0) S.cfg.perfil = pf0; } S.months = {}; saveCfg(); if (DB) { try { const snap = await DB.collection('data/users/' + UIDV).get(); for (const d of snap.docs) if (d.id !== 'config') await DB.doc('data/users/' + UIDV + '/' + d.id).delete(); } catch (err) {} }
      closeSheet(); render(); startOB(); break;
  }
});
function syncMovInputs() { if (!SH?.t) return; const m = $('#mMonto'), f = $('#mFecha'), n = $('#mNota'); if (m) SH.t.monto = m.value; if (f) SH.t.fecha = f.value; if (n) SH.t.nota = n.value; }
document.addEventListener('input', e => {
  if (e.target.id?.startsWith('ex_')) { exLive(); return; }
  if (e.target.id?.startsWith('nv_')) { nvRead(); nvLive(); nvAutoSave(); return; }
  if (e.target.id === 'ob_meta') { OB.meta = +e.target.value; obLive(); return; }
  if (e.target.dataset?.ob || e.target.dataset?.obm) { obRead(); obLive(); return; }
  const a = e.target.dataset?.act;
  if (a === 'buscar') { S.filtro.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); try { q.setSelectionRange(pos, pos); } catch (er) {} }
  if (a === 'mMonto' && SH?.t) SH.t.monto = e.target.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'auForm') { auEnviar(); return; }
  if (e.target.id === 'passForm') { guardarPass(); return; }
  if (e.target.id === 'gForm') { const err = SH.onSave(leerForm()); if (typeof err === 'string') { toast(err); return; } closeSheet(); render(); toast('Guardado'); }
  if (e.target.id === 'aForm') {
    S.cfg.nombre = $('#aNombre').value.trim() || S.cfg.nombre; S.cfg.tasa = num($('#aTasa').value) || 65;
    S.cfg.ahorro.emerg = num($('#aEm').value); S.cfg.ahorro.sal = num($('#aSal').value);
    saveCfg(); closeSheet(); render(); toast('Ajustes guardados');
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'importFile') {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => { try { restaurarDatos(JSON.parse(rd.result)); } catch (er) { toast('Ese archivo no es un respaldo de esta app'); } };
    rd.readAsText(file);
  }
  if (e.target.name === 'color') { document.querySelectorAll('#gForm input[name=color]').forEach(r => r.nextElementSibling.style.outline = r.checked ? '3px solid var(--ink)' : 'none'); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.classList?.contains('grp')) { S.cerrados ||= {}; S.cerrados[d.dataset.g] = !d.open; } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.infoOpen) { setInfo(false); document.querySelector('[data-act=creador]')?.focus(); } if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet(); if (e.key === 'Enter' && OB && !$('#ob').hidden && e.target.tagName === 'INPUT') { e.preventDefault(); obNext(); } });

/* ============ Arranque ============ */
(function boot() {
  try { aplicarTema(localStorage.getItem(LS_BASE + '-tema')); S.agrupar = localStorage.getItem(LS_BASE + '-agrupar') || 'reglon'; S.ordenTC = localStorage.getItem(LS_BASE + '-ordenTC') || 'pago'; } catch (e) {}
  if (nubeConfigurada()) { iniciarNube(); return; }
  const local = lsLoad();
  if (local && local.cfg) { S.cfg = migrate(local.cfg); S.months = local.months || {}; S.stamps = local.stamps || {}; migrarMeses(); } else S.cfg = plantilla();
  S.anim = true;
  render();
  const local0 = !!(local && local.cfg && local.cfg.onboarded);
  Promise.race([conectar(), new Promise(r => setTimeout(r, 3000))]).then(() => perfilAsegurar(() => { if (!S.cfg.onboarded && !local0 && !OB) startOB(); }));
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e)));
</script>
</body>
